version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: codexatlas-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: codexatlas-api
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite:////data/codexatlas.db
      - FRONTEND_URL=http://localhost:3000
    volumes:
      - backend_data:/data
    depends_on:
      - redis
    restart: always

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codexatlas-worker
    command: celery -A app.worker.celery_app worker --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite:////data/codexatlas.db
    volumes:
      - backend_data:/data
    depends_on:
      - redis
      - backend
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codexatlas-ui
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always

volumes:
  redis_data:
  backend_data:
