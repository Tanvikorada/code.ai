name: CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
        
    - name: Install dependencies
      working-directory: ./codexatlas/backend
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-asyncio httpx
        pip install -r requirements.txt
        
    - name: Run Pytest
      working-directory: ./codexatlas/backend
      env:
        REDIS_URL: redis://localhost:6379/0
      run: |
        pytest tests/

  frontend-checks:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: "18"
        
    - name: Install dependencies
      working-directory: ./codexatlas/frontend
      run: npm install
      
    - name: Lint
      working-directory: ./codexatlas/frontend
      run: npm run lint
      
    - name: Build
      working-directory: ./codexatlas/frontend
      run: npm run build
